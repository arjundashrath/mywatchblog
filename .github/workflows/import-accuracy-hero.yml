name: Import accuracy guide hero image

on:
  push:
    branches:
      - article-automatic-watch-accuracy-guide
    paths:
      - .github/workflows/import-accuracy-hero.yml

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: article-automatic-watch-accuracy-guide
      - name: Download public Google Drive image
        run: |
          python -m pip install --quiet gdown Pillow
          mkdir -p src/assets/blog/automatic-watch-accuracy
          python - <<'PY'
          import gdown
          from PIL import Image
          from pathlib import Path
          src = Path('/tmp/automatic-watch-hero')
          file_id = '1_Np5UA_6VTWNKGShumN_3czFyWdg2xvH'
          result = gdown.download(id=file_id, output=str(src), quiet=False)
          if not result:
              raise RuntimeError('Could not download Google Drive image. Ensure link access is enabled.')
          with Image.open(src) as im:
              im = im.convert('RGB')
              im.thumbnail((1800, 1800))
              out = Path('src/assets/blog/automatic-watch-accuracy/hero.jpg')
              im.save(out, 'JPEG', quality=86, optimize=True)
              print(f'Saved {out}, {out.stat().st_size} bytes')
          PY
      - name: Configure hero image in article
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/content/blog/automatic-watch-accuracy-explained.md')
          s=p.read_text()
          assert 'heroImage:' not in s.split('---',2)[1]
          s=s.replace('category: "learn"\n', 'category: "learn"\nheroImage: "../../assets/blog/automatic-watch-accuracy/hero.jpg"\n',1)
          p.write_text(s)
          PY
      - name: Commit imported hero image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/blog/automatic-watch-accuracy/hero.jpg src/content/blog/automatic-watch-accuracy-explained.md
          git commit -m "Add Google Drive hero image to automatic accuracy guide [skip ci]"
          git push
