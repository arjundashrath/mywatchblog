name: Import Orient photos from public Drive links

on:
  push:
    branches:
      - article/orient-mako-40-review
    paths:
      - .github/workflows/orient-photo-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Drive downloader and image verifier
        run: python -m pip install gdown==5.2.0 Pillow==11.3.0
      - name: Download and verify the three public photos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import tempfile
          import gdown
          from PIL import Image, ImageOps
          ids = [
              '177x2JjHgyThUGJfuCixOSHz7qdcqXnto',
              '1_Dmeg8ie3PGZEXXz3wI1s6fRsnjxgE6L',
              '1WG74RuM70utVMAyR-8XEbSLXdrZkZeHI',
          ]
          output = Path('src/assets/blog/orient-mako-40')
          output.mkdir(parents=True, exist_ok=True)
          mapped = {}
          with tempfile.TemporaryDirectory() as temp:
              for number, drive_id in enumerate(ids, 1):
                  path = Path(temp) / f'image-{number}.bin'
                  result = gdown.download(id=drive_id, output=str(path), quiet=False)
                  if not result or not path.is_file() or path.stat().st_size < 5000:
                      raise RuntimeError(f'File {number}: no usable download from Google Drive')
                  if path.stat().st_size > 15_000_000:
                      raise RuntimeError(f'File {number}: exceeds the 15 MB safety limit')
                  with Image.open(path) as im:
                      im.verify()
                  # The public Drive links were supplied in the same order as the three photos.
                  label = ('mako', 'kamasu', 'bambino')[number - 1]
                  destination = output / {
                    'mako':'mako-40-wrist-shot.jpg',
                    'kamasu':'orient-kamasu.jpg',
                    'bambino':'orient-bambino.jpg'
                  }[label]
                  with Image.open(path) as im:
                      if im.format not in ('JPEG', 'WEBP', 'PNG'):
                          raise RuntimeError(f'File {number}: unsupported image type {im.format}')
                      # Respect phone-camera EXIF orientation and make sensible web-sized JPEGs.
                      im = ImageOps.exif_transpose(im).convert('RGB')
                      width, height = im.size
                      im.thumbnail((2000, 2000), Image.Resampling.LANCZOS)
                      im.save(destination, 'JPEG', quality=90, optimize=True, progressive=True)
                  mapped[label] = destination
                  with Image.open(destination) as check:
                      check.verify()
                  print(f'Verified {label}: source {width}x{height}; output {destination.stat().st_size} bytes; SHA256 {hashlib.sha256(destination.read_bytes()).hexdigest()}')
          if set(mapped) != {'mako', 'kamasu', 'bambino'}:
              raise RuntimeError(f'Expected all three photographs; found {list(mapped)}')

          article = Path('src/content/blog/orient-mako-40-review.md')
          body = article.read_text()
          if 'heroImage:' in body:
              raise RuntimeError('Article already has a hero image; refusing to overwrite')
          body = body.replace(
              'priceRange: "25k-50k"\n',
              'priceRange: "25k-50k"\nheroImage: "../../assets/blog/orient-mako-40/mako-40-wrist-shot.jpg"\n',
              1
          )
          def insert_after(marker, addition):
              global body
              if body.count(marker) != 1:
                  raise RuntimeError(f'Expected exactly one occurrence of {marker!r}')
              body = body.replace(marker, marker + '\n\n' + addition, 1)
          insert_after(
              "And here's the thing. Even though I paid ₹23,000, I honestly wouldn't mind paying ₹35,000 for it. That's how highly I rate this watch.",
              '*Original wrist photograph of my white-dial Orient Mako 40. The same image appears as the article hero.*'
          )
          insert_after(
              "The Kamasu is particularly worth considering if you prefer a more traditional-looking dive watch. Common Kamasu variants have a larger case, a day-date display and the same broad value-first attitude that makes Orient so appealing.",
              '![Blue Orient Kamasu on a stainless steel bracelet, shown as an alternative to the Mako 40](../../assets/blog/orient-mako-40/orient-kamasu.jpg)'
          )
          insert_after(
              "It's one of the most highly regarded affordable automatic dress-watch collections, and for good reason. The vintage-inspired designs, elegant proportions and old-school charm make these watches incredibly appealing. If you're considering a Seiko Presage, I genuinely think the Bambino deserves a look too. The Presage collection has some fantastic dials, but the Bambino is such a lovely, credible alternative for someone who wants a stylish automatic dress watch without getting carried away.",
              '![Orient Bambino automatic dress watch with a light dial and dark leather strap](../../assets/blog/orient-mako-40/orient-bambino.jpg)'
          )
          article.write_text(body)
          PY
      - name: Commit only verified images and updated article to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/blog/orient-mako-40/ src/content/blog/orient-mako-40-review.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Add verified Orient photos from public Drive links"
          git push origin HEAD:article/orient-mako-40-review
